services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=local
      # 迁移清单/拓扑落盘路径：容器内固定目录，通过命名卷持久化，升级与回滚都可回查
      - MIGRATION_DB_PATH=/srv/data/migration.db
      - RELATION_SCHEMA_VERSION=2
    volumes:
      - migration_data:/srv/data
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      # 前端容器里的 127.0.0.1 是它自己，必须走 Compose 服务名访问后端。
      VITE_PROXY_TARGET: http://backend:8000
    depends_on:
      - backend

volumes:
  migration_data:
